# Debug configuration for Arduino Core Zephyr

# Enable debug mode
CONFIG_DEBUG=y

# Enable assertions
CONFIG_ASSERT=y
# CONFIG_ASSERT_VERBOSE=y

# Enable stack overflow detection (STACK_SENTINEL needs !MPU_STACK_GUARD)
CONFIG_STACK_SENTINEL=y
CONFIG_STACK_CANARIES=y

# Enable thread monitoring and debugging
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_DEBUG_THREAD_INFO=y

# Disable compiler optimizations
#CONFIG_DEBUG_OPTIMIZATIONS=y

# Enable and configure the shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_LEVEL_NONE=y
CONFIG_SHELL_LOG_BACKEND=n
#CONFIG_NET_SHELL=y
#CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_LOG_BACKEND_UART_AUTOSTART=n
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_REBOOT=y
CONFIG_LORA_SHELL=y

# Enable runtime statistics
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS=y

# Logging
# Keep the whole USB path quiet
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
CONFIG_NRF_USBD_COMMON_LOG_LEVEL_OFF=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_LOG_BUFFER_SIZE=4096
# Buffer log messages and send them from the log thread instead of the
# without sending directly; drops on overflow rather than blocking, so verbose
# logging cannot deadlock the CDC-ACM console it is routed through
CONFIG_LOG_MODE_DEFERRED=y
# Enabled log modules
CONFIG_LORA_LOG_LEVEL_DBG=y
CONFIG_LORAWAN_LOG_LEVEL_DBG=y
