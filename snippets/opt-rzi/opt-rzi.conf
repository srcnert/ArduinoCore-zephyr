# Build only the LoRaWAN regions RZI can select
CONFIG_LORA_BASICS_MODEM_ENABLE_ALL_REGIONS=n
CONFIG_LORA_BASICS_MODEM_REGION_AS_923=y
CONFIG_LORA_BASICS_MODEM_REGION_AU_915=y
CONFIG_LORA_BASICS_MODEM_REGION_CN_470=y
CONFIG_LORA_BASICS_MODEM_REGION_EU_868=y
CONFIG_LORA_BASICS_MODEM_REGION_IN_865=y
CONFIG_LORA_BASICS_MODEM_REGION_KR_920=y
CONFIG_LORA_BASICS_MODEM_REGION_RU_864=y
CONFIG_LORA_BASICS_MODEM_REGION_US_915=y

# Drop the LoRaWAN certification and test mode
CONFIG_LORA_BASICS_MODEM_CERTIFICATION=n
CONFIG_LORA_BASICS_MODEM_TEST_MODE=n

# Link sketches to loader exports by SLID instead of by name strings
CONFIG_LLEXT_EXPORT_BUILTINS_BY_SLID=y

# Let each sketch link only the math functions it calls
CONFIG_RAK_EXPORT_MATH=n

# Drop floating-point support from printf/scanf to save ~4.9 KB of flash from loader.
# Sketches that use them then link their own copy from picolibc instead
# (~6.3 KB for printf, ~5.1 KB for scanf).
CONFIG_CBPRINTF_FP_SUPPORT=n

# Let each sketch link its own mktime() and strerror_r()
CONFIG_RAK_EXPORT_LIBC_EXTRAS=n

# Drop the logging subsystem and the boot banner
CONFIG_LOG=n
CONFIG_LOG_PRINTK=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_BOOT_BANNER=n
