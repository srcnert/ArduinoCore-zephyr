# Debug configuration for Arduino Core Zephyr

# Enable logging
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_UART=y

# Enable RTT logging
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_OVERWRITE=y

# Enable debug mode
CONFIG_DEBUG=y

# Enable assertions
CONFIG_ASSERT=y
# CONFIG_ASSERT_VERBOSE=y
CONFIG_DEVICE_API_ASSERT=n

# Enable stack overflow detection (STACK_SENTINEL needs !MPU_STACK_GUARD)
CONFIG_STACK_SENTINEL=y
CONFIG_STACK_CANARIES=y

# Enable thread monitoring and debugging
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_DEBUG_THREAD_INFO=y

# Disable compiler optimizations
#CONFIG_DEBUG_OPTIMIZATIONS=y

# Enable and configure the shell
CONFIG_SHELL=y
#CONFIG_NET_SHELL=y
#CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_LOG_BACKEND_UART_AUTOSTART=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# Enable runtime statistics
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_THREAD_RUNTIME_STATS=y
