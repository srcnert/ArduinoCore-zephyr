name: RAKwireless Build

on:
  pull_request:
    branches: [rak-main]
  push:
    branches: [rak-main]

concurrency:
  group: rak-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-loader:
    name: Build loader
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: zephyrprojectrtos/ci-base:latest
      # apt-get needs root; the image's default user is 'user'.
      options: --user root
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      MODULE_PATH: ArduinoCore-zephyr
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true  # needed by get_core_version.sh
          persist-credentials: false
          path: ArduinoCore-zephyr

      - name: Install curl, jq, zstd and cppcheck
        run: apt-get update -qq && apt-get install -y -qq curl jq zstd cppcheck

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ${{ env.MODULE_PATH }}
          toolchains: arm-zephyr-eabi
          west-project-filter: -hal_.*,+hal_nordic
          enable-ccache: false

      - name: Fetch the Arduino API blob
        # Upstream ships the Arduino API as a west blob since PR #568;
        # the loader CMake configure fails without it.
        working-directory: ${{ env.MODULE_PATH }}
        run: west blobs --auto-accept fetch arduino-api

      - name: Export Zephyr CMake package
        # Registers Zephyr in ~/.cmake so that find_package(Zephyr) works
        # in extra/get_variant_name.cmake (upstream's bootstrap.sh does
        # this too; action-zephyr-setup does not).
        working-directory: ${{ env.MODULE_PATH }}
        run: west zephyr-export

      - name: Build loader
        working-directory: ${{ env.MODULE_PATH }}
        run: |
          mkdir -p venv/bin && touch venv/bin/activate
          ./extra/build.sh nrf52840dk

      - name: Build samples
        # Standalone Zephyr build of the samples
        working-directory: ${{ env.MODULE_PATH }}
        run: west rak-sample-check

      - name: Fetch the PR base branch
        # rak-lint diffs the working tree against the merge-base with
        # rak-main, which the detached PR checkout does not have locally.
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.MODULE_PATH }}
        run: git fetch origin "$GITHUB_BASE_REF:$GITHUB_BASE_REF"

      - name: Cppcheck static analysis
        # Runs against the real headers of the build above. Skipped on
        # upstream sync PRs, like the rak-checks workflow.
        if: ${{ github.event_name != 'pull_request' ||
          !contains(github.event.pull_request.labels.*.name, 'upstream-sync') }}
        working-directory: ${{ env.MODULE_PATH }}
        run: west rak-lint -v -b build/nrf52840dk_nrf52840

      - name: Install arduino-cli
        # Pinned (script and binary) for reproducible sketch builds.
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/arduino/arduino-cli/v1.5.1/install.sh \
            | BINDIR=/usr/local/bin sh -s 1.5.1
          arduino-cli version

      - name: Install the Arduino Zephyr toolchain
        run: arduino-cli core install arduino:zephyr_main@0.90.0

      - name: Compile sketches
        working-directory: ${{ env.MODULE_PATH }}
        env:
          ARDUINO_DIRECTORIES_USER: /tmp/arduino-user
        run: |
          mkdir -p "$ARDUINO_DIRECTORIES_USER/hardware/rak"
          ln -sfn "$PWD" "$ARDUINO_DIRECTORIES_USER/hardware/rak/zephyr"
          west rak-sketch-check
