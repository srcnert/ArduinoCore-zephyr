name: RAKwireless Build

on:
  pull_request:
    branches: [rak-main]
  push:
    branches: [rak-main]

concurrency:
  group: rak-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-loader:
    name: Build loader
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: zephyrprojectrtos/ci-base:latest
      # apt-get needs root; the image's default user is 'user'.
      options: --user root
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      MODULE_PATH: ArduinoCore-zephyr
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true  # needed by get_core_version.sh
          persist-credentials: false
          path: ArduinoCore-zephyr

      - name: Install jq, zstd and cppcheck
        # jq is needed by extra/build.sh and extra/get_board_details.sh,
        # zstd by tar to extract the llext-edk tarball, cppcheck by
        # 'west rak-lint'; none is part of the ci-base image.
        run: apt-get update -qq && apt-get install -y -qq jq zstd cppcheck

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: ${{ env.MODULE_PATH }}
          toolchains: arm-zephyr-eabi
          west-project-filter: -hal_.*,+hal_nordic
          enable-ccache: false

      - name: Export Zephyr CMake package
        # Registers Zephyr in ~/.cmake so that find_package(Zephyr) works
        # in extra/get_variant_name.cmake (upstream's bootstrap.sh does
        # this too; action-zephyr-setup does not).
        working-directory: ${{ env.MODULE_PATH }}
        run: west zephyr-export

      - name: Build loader
        working-directory: ${{ env.MODULE_PATH }}
        run: |
          mkdir -p venv/bin && touch venv/bin/activate
          ./extra/build.sh nrf52840dk/nrf52840

      - name: Fetch the PR base branch
        # rak-lint diffs the working tree against the merge-base with
        # rak-main, which the detached PR checkout does not have locally.
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.MODULE_PATH }}
        run: git fetch origin "$GITHUB_BASE_REF:$GITHUB_BASE_REF"

      - name: Cppcheck static analysis
        # Runs against the real headers of the build above. Skipped on
        # upstream sync PRs, like the rak-checks workflow.
        if: ${{ github.event_name != 'pull_request' ||
          !contains(github.event.pull_request.labels.*.name, 'upstream-sync') }}
        working-directory: ${{ env.MODULE_PATH }}
        run: west rak-lint -v -b build/nrf52840dk_nrf52840

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Build host tools
        working-directory: ${{ env.MODULE_PATH }}
        run: |
          (cd tools/zephyr-sketch-tool && go build)
          (cd tools/gen-rodata-ld && go build)
          (cd tools/zephyr-check-size && go build)

      - name: Install arduino-cli
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR=/usr/local/bin sh

      - name: Compile sketches
        working-directory: ${{ env.MODULE_PATH }}
        env:
          ARDUINO_DIRECTORIES_USER: /tmp/arduino-user
        run: |
          mkdir -p "$ARDUINO_DIRECTORIES_USER/hardware/rak"
          ln -s "$PWD" "$ARDUINO_DIRECTORIES_USER/hardware/rak/zephyr"
          west rak-sketch-check
