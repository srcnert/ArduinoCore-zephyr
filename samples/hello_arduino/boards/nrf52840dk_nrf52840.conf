CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="RAKwireless RAK4631"
CONFIG_USB_DEVICE_MANUFACTURER="RAKwireless"
# Use Nordic's VID and PID
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x5300
CONFIG_USB_CONFIGURATION_STRING_DESC_ENABLE=n

CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_BUF_POOL=y
CONFIG_UART_LINE_CTRL=y
# CONFIG_USBD_CDC_ACM_LOG_LEVEL_ERR=y
# CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
# CONFIG_USBD_LOG_LEVEL_ERR=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_COUNTER=y

CONFIG_FPU=y

CONFIG_LOG=n
