CONFIG_RAK_REGOUT0_FIX=y
CONFIG_RAK_DOUBLE_TAP=y

CONFIG_BOOT_SERIAL_UART=n
CONFIG_BOOT_SERIAL_CDC_ACM=y

CONFIG_WARN_DEPRECATED=n

# USB identity of the bootloader; a different PID from the loader (0x5300).
CONFIG_USB_DEVICE_PRODUCT="RAKwireless RAK4631"
CONFIG_USB_DEVICE_MANUFACTURER="RAKwireless"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x5301
# MCUboot enables USB itself when it enters recovery.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
