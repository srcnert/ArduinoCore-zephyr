CONFIG_BOOT_SERIAL_UART=n
CONFIG_BOOT_SERIAL_CDC_ACM=y

CONFIG_WARN_DEPRECATED=n

# USB identity of the bootloader; a different PID from the loader (0x5300).
CONFIG_BOOT_SERIAL_CDC_ACM_PRODUCT_STRING="nRF52840 DK"
CONFIG_BOOT_SERIAL_CDC_ACM_MANUFACTURER_STRING="Nordic Semiconductor"
CONFIG_BOOT_SERIAL_CDC_ACM_VID=0x1915
CONFIG_BOOT_SERIAL_CDC_ACM_PID=0x5301
