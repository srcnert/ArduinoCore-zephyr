CONFIG_MAIN_STACK_SIZE=4096

# Enable Serial Recovery over UART
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# Force ECDSA-P256, since this is not necessarily the default
CONFIG_BOOT_SIGNATURE_TYPE_RSA=n
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# The build won't fit on the partition allocated for it without size
# optimizations.
CONFIG_SIZE_OPTIMIZATIONS=y

# Use minimal C library instead of the Picolib
CONFIG_MINIMAL_LIBC=y

CONFIG_FLASH=y
CONFIG_MCUBOOT_INDICATION_LED=y
CONFIG_REBOOT=y
CONFIG_CBPRINTF_NANO=y

CONFIG_LOG=n
CONFIG_LOG_PRINTK=n

CONFIG_BOOT_BANNER=n
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
