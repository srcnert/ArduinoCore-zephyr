CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255
CONFIG_BT_MAX_CONN=4
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_ADV_PERIODIC=y
CONFIG_BT_RX_STACK_SIZE=4096

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="RAKwireless RAK4631"
CONFIG_USB_DEVICE_MANUFACTURER="RAKwireless"
# Use Nordic's VID and PID
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x5300

CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=1024
# Each CDC-ACM port keeps up to 2 transfers in flight at once.
# Use 8 to cover the 6 required plus headroom for transient overlap.
CONFIG_USB_MAX_NUM_TRANSFERS=8
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y

CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_COUNTER=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAMAC_REGION_EU868=y
CONFIG_LORAWAN_SERVICES=n
CONFIG_LORAWAN_NVM_SETTINGS=y

# NVS required to store LoRaWAN DevNonce
# as per LoRaWAN 1.0.4/1.1 Specifications.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LLEXT_HEAP_SIZE=128
CONFIG_MAIN_STACK_SIZE=16384

CONFIG_FPU=y

CONFIG_STACK_USAGE=n
CONFIG_STACK_SENTINEL=n
CONFIG_STACK_CANARIES=n

# Logging
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=n
CONFIG_LOG_DEFAULT_LEVEL=2
